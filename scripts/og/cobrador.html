<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Montserrat:wght@300;400&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0C0C0C; color: #fff;
    font-family: Inter, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(700px circle at 50% 118%, rgba(255,59,48,0.10), transparent 60%),
                radial-gradient(900px circle at 50% -30%, rgba(255,255,255,0.035), transparent 60%);
  }
  .frame {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 46px; }
  .brand svg { width: 40px; height: 40px; }
  .brand span { font-family: Montserrat, Futura, sans-serif; font-weight: 300; font-size: 22px; letter-spacing: 0.42em; margin-right: -0.42em; }
  .kicker { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .kicker i { display: block; width: 40px; height: 2px; background: #FF3B30; }
  .kicker span { font-family: Montserrat, sans-serif; font-weight: 400; font-size: 17px; letter-spacing: 0.34em; color: #FF3B30; text-transform: uppercase; margin-right: -0.34em; }
  h1 { margin: 0; font-weight: 300; font-size: 88px; line-height: 1.06; letter-spacing: -0.015em; }
  .url { margin-top: 44px; font-size: 22px; color: #8a8a8a; letter-spacing: 0.04em; }
  .url b { color: #D4AF37; font-weight: 400; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame">
    <div class="brand">
      <svg viewBox="0 0 600 600" aria-hidden="true"><g fill="#fff">
        <polygon points="68,90 108,90 301,468 299,468" />
        <polygon points="492,90 532,90 301,468 299,468" />
        <path d="M 328,100 L 340,100 C 330,250 312,380 301,468 L 299,468 C 308,380 320,250 328,100 Z" />
      </g></svg>
      <span>ONZA</span>
    </div>
    <div class="kicker"><i></i><span>Cobranza B2B</span><i></i></div>
    <h1>Contrata tu primer<br>cobrador digital</h1>
    <p class="url">onzaai.com/<b>cobrador</b></p>
  </div>
</body>
</html>
